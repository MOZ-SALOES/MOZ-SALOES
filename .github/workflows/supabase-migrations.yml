name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and apply pending Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check deployment credentials
        id: credentials
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          if [[ -n "$SUPABASE_DB_URL" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add SUPABASE_DB_URL under Settings > Secrets and variables > Actions."
          fi

      - name: Verify historical migration sources are present
        id: history
        shell: bash
        run: |
          missing=0
          for version in 20261116142902 20261116142926 20261116143053 20261116143243 20261116145347 20261116145917 20261116150303 20261116150701; do
            if ! compgen -G "supabase/migrations/${version}_*.sql" > /dev/null; then
              echo "::warning::Missing historical migration source for version ${version}."
              missing=1
            fi
          done
          if [[ "$missing" -eq 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment blocked to prevent migration-history drift. Restore all eight SQL files recovered from the remote migration records before deploying."
          fi

      - name: Install Supabase CLI
        if: steps.credentials.outputs.ready == 'true' && steps.history.outputs.ready == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Check migration state before applying
        if: steps.credentials.outputs.ready == 'true' && steps.history.outputs.ready == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url="$SUPABASE_DB_URL"

      - name: Apply pending migrations
        if: steps.credentials.outputs.ready == 'true' && steps.history.outputs.ready == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url="$SUPABASE_DB_URL" --yes

      - name: Verify migration history after deployment
        if: steps.credentials.outputs.ready == 'true' && steps.history.outputs.ready == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url="$SUPABASE_DB_URL"

      - name: Report deployment safely blocked
        if: steps.credentials.outputs.ready != 'true' || steps.history.outputs.ready != 'true'
        run: echo "Deployment was not attempted because the database URL secret is missing or the migration baseline is incomplete."
