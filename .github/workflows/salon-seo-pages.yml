name: Generate and publish salon SEO pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.js'
      - 'favicon.svg'
      - 'manifest.webmanifest'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/generate-salon-pages.mjs'
      - '.github/workflows/salon-seo-pages.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: moz-saloes-pages
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check generator syntax
        run: node --check scripts/generate-salon-pages.mjs

      - name: Generate one public page for each active salon
        run: node scripts/generate-salon-pages.mjs

      - name: Configure GitHub Pages for workflow deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('PUT /repos/{owner}/{repo}/pages', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: 'workflow'
            });

      - name: Prepare only public website files
        shell: bash
        run: |
          mkdir -p site
          cp index.html admin.js favicon.svg manifest.webmanifest robots.txt sitemap.xml site/
          cp -R saloes site/saloes
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
