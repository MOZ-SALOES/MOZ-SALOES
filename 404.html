<!doctype html>
<html lang="pt-MZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#102b63">
  <title>A abrir o perfil — MOZ SALÕES</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#17243a;font:16px/1.5 system-ui,sans-serif}
    main{max-width:520px;margin:20px;padding:28px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;text-align:center}
    a{color:#1558a6;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>MOZ SALÕES 🇲🇿</h1>
    <p>Estamos a abrir o perfil que procuras. Aguarda um momento…</p>
    <p><a id="fallback" href="/MOZ-SALOES/">Abrir o directório</a></p>
  </main>
  <script>
    (function(){
      const base='/MOZ-SALOES/';
      const match=location.pathname.match(/\/saloes\/[^/]+-([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\/?$/i);
      const target=new URL(base,location.origin);
      if(match)target.searchParams.set('salao',match[1]);
      document.getElementById('fallback').href=target.toString();
      location.replace(target.toString());
    })();
  </script>
</body>
</html>
